name: 머지전 PR 체크

on:
  pull_request:
    branches:
      - Master
      - Develop
      - Weekly*
      - Review
      - weekly*

  workflow_dispatch:

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache node modules
        uses: actions/cache@v3
        id: cache
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm i

      - name: Eslint Check
        run: npm run lint

      - name: Create .env File
        env:
          PREFIX: "REACT_APP_"
          SECRETS: ${{ toJson(secrets) }}
        run: |
          touch .env && \
          jq -r 'to_entries|map("\(.key)=\(.value|tostring)")|.[]' <<< "$SECRETS" | grep $PREFIX > .env

      - name: Build Test
        run: npm run build
